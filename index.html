<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Khwahish</title>
  <meta name="description"
    content="Get in touch with Khwahish, developer based in Jaipur, India. Let's build something great together.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=306">
</head>

<body>

  <div id="app">

    <div id="form-panel" aria-hidden="true">
      <div id="form-inner">

        <header id="form-header">
          <h1 class="editorial-headline">hey khwahish,<br>we need you.</h1>
        </header>

        <form id="contact-form" novalidate>

          <div class="field-group">
            <label for="f-name">YOUR NAME</label>
            <div class="field-line-wrap">
              <input id="f-name" type="text" name="name" autocomplete="name" spellcheck="false" required>
              <span class="field-line" aria-hidden="true"></span>
            </div>
          </div>

          <div class="field-group">
            <label for="f-email">YOUR EMAIL</label>
            <div class="field-line-wrap">
              <input id="f-email" type="email" name="email" autocomplete="email" spellcheck="false" required>
              <span class="field-line" aria-hidden="true"></span>
            </div>
          </div>

          <div class="field-group">
            <label for="f-project">YOUR PROJECT IS ABOUT</label>
            <div class="field-line-wrap">
              <input id="f-project" type="text" name="project" spellcheck="false" required>
              <span class="field-line" aria-hidden="true"></span>
            </div>
          </div>

          <div class="budget-row">
            <div class="budget-left">
              <span class="budget-label">PROJECT BUDGET (USD)</span>
              <div class="budget-pills" role="group" aria-label="Select project budget">
                <button type="button" class="pill" data-value="50k-100k">50K–100K</button>
                <button type="button" class="pill" data-value="100k-300k">100K–300K</button>
                <button type="button" class="pill" data-value="300k+">300K+</button>
              </div>
            </div>

            <button type="submit" id="send-btn" aria-label="Send message">
              <span>SEND</span>
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
                <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </div>

        </form>

      </div>
    </div>

    <div id="cinematic" role="img" aria-label="Cinematic satellite switch from Los Angeles to Jaipur">

      <div id="satellite-stage-view" aria-hidden="true">
        <canvas id="surveillance-engine" width="1920" height="1080"></canvas>
      </div>

      <div id="vignette" aria-hidden="true"></div>

      <div id="grain" aria-hidden="true"></div>

      <div id="scanlines" aria-hidden="true"></div>

      <div id="gta-wash" aria-hidden="true"></div>

      <div id="gta-clouds" aria-hidden="true">
        <div id="gta-cloud-1" class="gta-cloud"></div>
        <div id="gta-cloud-2" class="gta-cloud"></div>
        <div id="gta-cloud-3" class="gta-cloud"></div>
        <div id="gta-cloud-4" class="gta-cloud"></div>
      </div>

      <div id="gta-flash" aria-hidden="true"></div>

      <div id="pin-card" class="pin-hidden" aria-hidden="true">
        <div class="pin-info">
          <div class="pin-name">Khwahish</div>
          <div class="pin-location">Jaipur, Rajasthan</div>
        </div>
      </div>

    </div>

  </div>

  <script src="engine-satellite.js?v=309"></script>
  <script src="script.js?v=309"></script>

</body>

</html>
